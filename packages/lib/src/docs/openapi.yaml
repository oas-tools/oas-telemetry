openapi: 3.1.0
info:
  title: '@oas-tools/oas-telemetry'
  version: 0.7.0-alpha.2
  license:
    name: Apache-2.0
  description: |-
    Automatically collects and stores telemetry data in memory using OpenTelemetry.
    Just import the Express middleware to access it through the built-in REST API or web UI—no extra setup required.

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: oas-tlm-access-token

security:
  - CookieAuth: []

servers:
  - url: "{protocol}://{host}:{port}/{basePath}"
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: localhost
      port:
        default: "3000"
      basePath:
        default: oas-telemetry
        description: Base path for all endpoints. Configured via OASTLM_BOOT_BASE_URL environment variable

tags:
  - name: traces
    description: Operations for managing telemetry traces
  - name: metrics
    description: Operations for managing telemetry metrics
  - name: logs
    description: Operations for managing telemetry logs
  - name: utils
    description: Utility endpoints
  - name: ui
    description: User interface
  - name: ai
    description: AI-related operations
  - name: plugins
    description: Operations for managing plugins
  - name: auth
    description: Authentication operations

paths:
  /:
    get:
      summary: Redirect to telemetry UI (Only works in production mode)
      tags:
        - ui
      responses:
        '302':
          description: Found
          content:
            text/html:
              schema:
                type: string
                example: <p>Found. Redirecting to /oas-telemetry-ui</p>

  /oas-telemetry-ui:
    get:
      summary: OAS-Telemetry Web UI (Only works in production mode)
      tags:
        - ui
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: <!DOCTYPE html><title>OAS-Telemetry UI</title></head><body><h1>Welcome to OAS-Telemetry UI</h1></body></html>

  /spans/exporters/in-memory-exporter/data:
    get:
      summary: Get collected spans
      tags:
        - traces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  spansCount:
                    type: number
                    example: 0
                  spans:
                    type: array
                    items:
                      type: object
                    example: []
    post:
      summary: Insert spans (optionally reset first)
      description: |
        Inserts spans. If the query parameter `reset=true` is provided, the span database is reset before inserting.
        The response message will indicate whether a reset occurred.
      tags:
        - traces
      parameters:
        - name: reset
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
          description: If true, reset the database before inserting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spans:
                  type: array
                  items:
                    type: object
                  description: Array of trace objects (spans) to insert
              example:
                spans:
                  - _spanContext:
                      traceId: "123"
                      spanId: "456"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Inserted 1 spans.
                  InsertedTracesCount:
                    type: number
                    example: 1
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid data format. Expected an array of JSON objects.
    delete:
      summary: Reset spans database
      tags:
        - traces
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Traces reset

  /spans/exporters/in-memory-exporter/data/find:
    post:
      summary: Find spans
      tags:
        - traces
      requestBody:
        required: true
        description: Search criteria for spans.
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  additionalProperties: true
                  description: Mongo-like query criteria
                  example:
                    attributes.http.target:
                      $regex: "^/api/v1/pets.*$"
                    attributes.http.method: "GET"
                    $or:
                      - attributes.http.status_code:
                          $lte: 400
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  spansCount:
                    type: number
                    example: 0
                  spans:
                    type: array
                    items:
                      type: object
                    example: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid regex in query

  /spans/exporters/in-memory-exporter/start:
    post:
      summary: Start spans collection
      tags:
        - traces
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Traces started

  /spans/exporters/in-memory-exporter/stop:
    post:
      summary: Stop spans collection
      tags:
        - traces
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Traces stopped

  /spans/exporters/in-memory-exporter/status:
    get:
      summary: Get spans collection status
      tags:
        - traces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    example: true

  /spans/exporters/in-memory-exporter/reset:
    post:
      summary: Reset spans database
      tags:
        - traces
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Traces reset

  /spans/exporters/in-memory-exporter/retention-time:
    get:
      summary: Get spans retention time (seconds)
      tags:
        - traces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  retentionTimeInSeconds:
                    type: number
                    example: 3600
    post:
      summary: Set retention time for spans
      tags:
        - traces
      requestBody:
        required: true
        description: Retention time in seconds.
        content:
          application/json:
            schema:
              type: object
              properties:
                retentionTimeInSeconds:
                  type: number
                  description: Retention time in seconds.
                  example: 3600
            example:
              retentionTimeInSeconds: 3600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Retention time set to 3600 seconds.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid retention time. Must be a positive number.

  /spans/exporters/in-memory-exporter/export:
    get:
      tags:
        - traces
      summary: Export collected spans
      description: Export all collected spans in line-delimited JSON format
      responses:
        '200':
          description: Spans exported successfully
          content:
            application/json:
              schema:
                type: string

  /spans/exporters/in-memory-exporter/import:
    post:
      tags:
        - traces
      summary: Import spans
      description: Import spans from line-delimited JSON format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Spans imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Spans imported successfully

  /traces/{traceId}:
    get:
      summary: Get spans by trace ID
      tags:
        - traces
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
          description: The trace ID to filter spans by
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  spansCount:
                    type: number
                    example: 0
                  spans:
                    type: array
                    items:
                      type: object
                    example: []

  /metrics/exporters/in-memory-exporter/data:
    get:
      summary: Get collected metrics
      tags:
        - metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metricsCount:
                    type: number
                    example: 0
                  metrics:
                    type: array
                    items:
                      type: object
                    example: []
    post:
      summary: Insert metrics (optionally reset first)
      description: |
        Inserts metrics. If the query parameter `reset=true` is provided, the metrics database is reset before inserting.
        The response message will indicate whether a reset occurred.
      tags:
        - metrics
      parameters:
        - name: reset
          in: query
          required: false
          schema:
            type: boolean
          description: If true, reset the database before inserting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Inserted 25 metrics.
                  InsertedMetricsCount:
                    type: number
                    example: 25
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid data format. Expected an array of JSON objects.
    delete:
      summary: Reset metrics database
      tags:
        - metrics
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Metrics reset

  /metrics/exporters/in-memory-exporter/data/find:
    post:
      summary: Find metrics
      tags:
        - metrics
      requestBody:
        required: true
        description: Mongo-like (nedb) query object for metrics filtering.
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  additionalProperties: true
                  description: Mongo-like query criteria
                  example:
                    metricId: "123"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metricsCount:
                    type: number
                    example: 0
                  metrics:
                    type: array
                    items:
                      type: object
                    example: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid regex in query

  /metrics/exporters/in-memory-exporter/start:
    post:
      summary: Start metrics collection
      tags:
        - metrics
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Metrics collection started

  /metrics/exporters/in-memory-exporter/stop:
    post:
      summary: Stop metrics collection
      tags:
        - metrics
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Metrics collection stopped

  /metrics/exporters/in-memory-exporter/status:
    get:
      summary: Get metrics collection status
      tags:
        - metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    example: true

  /metrics/exporters/in-memory-exporter/reset:
    post:
      summary: Reset metrics database
      tags:
        - metrics
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Metrics reset

  /metrics/exporters/in-memory-exporter/retention-time:
    get:
      summary: Get metrics retention time (seconds)
      tags:
        - metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  retentionTimeInSeconds:
                    type: number
                    example: 3600
    post:
      summary: Set retention time for metrics
      tags:
        - metrics
      requestBody:
        required: true
        description: Retention time in seconds.
        content:
          application/json:
            schema:
              type: object
              properties:
                retentionTimeInSeconds:
                  type: number
                  description: Retention time in seconds.
                  example: 3600
            example:
              retentionTimeInSeconds: 3600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Retention time set to 3600 seconds.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid retention time. Must be a positive number.

  /metrics/exporters/in-memory-exporter/export:
    get:
      tags:
        - metrics
      summary: Export collected metrics
      description: Export all collected metrics in line-delimited JSON format
      responses:
        '200':
          description: Metrics exported successfully
          content:
            application/json:
              schema:
                type: string

  /metrics/exporters/in-memory-exporter/import:
    post:
      tags:
        - metrics
      summary: Import metrics
      description: Import metrics from line-delimited JSON format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Metrics imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Metrics imported successfully

  /metrics/stats:
    get:
      tags:
        - metrics
      summary: Get metrics statistics
      description: Get statistics about collected metrics
      responses:
        '200':
          description: Metrics statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMetrics:
                    type: number
                    example: 42
                  activeMetrics:
                    type: number
                    example: 35
                  retentionTime:
                    type: number
                    description: Retention time in seconds
                    example: 3600

  /logs/exporters/in-memory-exporter/data:
    get:
      summary: Get collected logs
      tags:
        - logs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {}
                example:
                  items: []
    post:
      summary: Insert logs (optionally reset first)
      description: |
        Inserts logs. If the query parameter `reset=true` is provided, the logs database is reset before inserting.
        The response message will indicate whether a reset occurred.
      tags:
        - logs
      parameters:
        - name: reset
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
          description: If true, reset the database before inserting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logs:
                  type: array
                  items:
                    type: object
                  description: Array of log objects to insert
              example:
                logs:
                  - body: "Hello World!"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Inserted 6 logs.
                  InsertedLogsCount:
                    type: number
                    example: 6
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid data format. Expected an array of JSON objects.
    delete:
      summary: Reset logs database
      tags:
        - logs
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Logs reset

  /logs/exporters/in-memory-exporter/data/find:
    post:
      summary: Find logs
      tags:
        - logs
      requestBody:
        required: true
        description: Search criteria for logs. Supports textSearch, a Mongo-like (nedb) query, and sort.
        content:
          application/json:
            schema:
              type: object
              properties:
                textSearch:
                  type: string
                  description: Text that the log body must contain
                query:
                  type: object
                  additionalProperties: true
                  description: Mongo-like query criteria
                sort:
                  type: object
                  additionalProperties: true
                  description: Sort order for logs
                  example:
                    timestamp: -1
                limit:
                  type: integer
                  description: Number of logs to return
                  default: 50
              example:
                textSearch: "World!"
                query: {}
                sort:
                  timestamp: -1
                limit: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {}
                example:
                  items: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid regex in query

  /logs/exporters/in-memory-exporter/start:
    post:
      summary: Start logs collection
      tags:
        - logs
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Logs started

  /logs/exporters/in-memory-exporter/stop:
    post:
      summary: Stop logs collection
      tags:
        - logs
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Logs stopped

  /logs/exporters/in-memory-exporter/status:
    get:
      summary: Get logs collection status
      tags:
        - logs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    example: true

  /logs/exporters/in-memory-exporter/reset:
    post:
      summary: Reset logs database
      tags:
        - logs
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                example: Logs reset

  /logs/exporters/in-memory-exporter/retention-time:
    get:
      summary: Get logs retention time (seconds)
      tags:
        - logs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  retentionTimeInSeconds:
                    type: number
                    example: 3600
    post:
      summary: Set retention time for logs
      tags:
        - logs
      requestBody:
        required: true
        description: Retention time in seconds.
        content:
          application/json:
            schema:
              type: object
              properties:
                retentionTimeInSeconds:
                  type: number
                  description: Retention time in seconds.
                  example: 3600
            example:
              retentionTimeInSeconds: 3600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Retention time set to 3600 seconds.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid retention time. Must be a positive number.

  /logs/exporters/in-memory-exporter/export:
    get:
      tags:
        - logs
      summary: Export collected logs
      description: Export all collected logs in line-delimited JSON format
      responses:
        '200':
          description: Logs exported successfully
          content:
            application/json:
              schema:
                type: string

  /logs/exporters/in-memory-exporter/import:
    post:
      tags:
        - logs
      summary: Import logs
      description: Import logs from line-delimited JSON format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Logs imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logs imported successfully

  /utils/spec:
    get:
      summary: Get OpenAPI spec in JSON
      tags:
        - utils
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  paths:
                    type: object

  /utils/heapStats:
    get:
      summary: Get heap statistics
      tags:
        - utils
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_heap_size:
                    type: number
                  total_heap_size_executable:
                    type: number
                  total_physical_size:
                    type: number
                  total_available_size:
                    type: number
                  used_heap_size:
                    type: number
                  heap_size_limit:
                    type: number
                  malloced_memory:
                    type: number
                  peak_malloced_memory:
                    type: number
                  does_zap_garbage:
                    type: integer
                  number_of_native_contexts:
                    type: integer
                  number_of_detached_contexts:
                    type: integer
                  total_global_handles_size:
                    type: number
                  used_global_handles_size:
                    type: number
                  external_memory:
                    type: number
                  units:
                    type: string
                example:
                  total_heap_size: 46.418
                  total_heap_size_executable: 3
                  total_physical_size: 46.418
                  total_available_size: 4101.352
                  used_heap_size: 42.636
                  heap_size_limit: 4144
                  malloced_memory: 0.531
                  peak_malloced_memory: 67.936
                  does_zap_garbage: 0
                  number_of_native_contexts: 0
                  number_of_detached_contexts: 0
                  total_global_handles_size: 0.055
                  used_global_handles_size: 0.04
                  external_memory: 9.393
                  units: "MB"

  /utils/generate-log:
    post:
      summary: Generate a sample log
      tags:
        - utils
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                log:
                  type: string
                  description: The log message to generate. Defaults to "Default log message" if not specified.
                repeat:
                  type: integer
                  description: Number of times to repeat the log message.
                  default: 1
                method:
                  type: string
                  description: Log method (log, warn, error, info, debug).
                  enum: [log, warn, error, info, debug]
                  default: log
              example:
                log: "Hello World!"
                repeat: 2
                method: "info"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Log generated
                  log:
                    type: string
                    example: Hello World!
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid method. Use log, warn, error, info, or debug.

  /utils/generate-mock-logs:
    post:
      summary: Generate mock logs
      tags:
        - utils
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  description: Number of mock logs to generate.
                  default: 50
              example:
                count: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Started generating mock logs

  /utils/generate-wait:
    get:
      summary: Wait for the specified seconds
      tags:
        - utils
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Number of seconds to wait. Defaults to 1 if not specified.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  waited:
                    type: number
                    example: 2

  /utils/oas-telemetry-spec:
    get:
      summary: Get OAS-Telemetry specification
      tags:
        - utils
      description: Retrieve the OpenAPI specification for OAS-Telemetry
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: OpenAPI specification

  /health:
    get:
      summary: Health check
      tags:
        - utils
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK


  /plugins:
    get:
      summary: List all registered plugins
      tags:
        - plugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pluginsCount:
                    type: integer
                    description: Number of plugins
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        url:
                          type: string
                        active:
                          type: boolean
                example:
                  pluginsCount: 1
                  plugins:
                    - id: "plugin-1"
                      name: "Sample Plugin"
                      url: "https://example.com/plugin.js"
                      active: true
    post:
      summary: Register a new plugin
      tags:
        - plugins
      requestBody:
        required: true
        description: Plugin registration details
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - moduleFormat
              properties:
                id:
                  type: string
                  description: Unique identifier for the plugin
                url:
                  type: string
                  description: URL of the plugin to register
                code:
                  type: string
                  description: Inline code of the plugin (optional if URL is provided)
                install:
                  type: object
                  description: Dependencies to install for the plugin
                  properties:
                    dependencies:
                      type: array
                      items:
                        type: string
                      description: List of dependencies
                    ignoreErrors:
                      type: boolean
                      description: Whether to ignore errors during installation
                config:
                  type: object
                  description: Configuration for the plugin
                moduleFormat:
                  type: string
                  description: Module format of the plugin (e.g., "ESM" or "CJS")
              example:
                id: "plugin-1"
                name: "Sample Plugin"
                description: "A sample plugin for demonstration"
                code: "console.log('Hello from plugin');export const plugin = {load:()=>{console.log('Plugin loaded')}, isConfigured:()=>true};"
                install:
                  dependencies: []
                  ignoreErrors: true
                config:
                  key: "value"
                moduleFormat: "ESM"
      responses:
        '201':
          description: Plugin registered successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Plugin code or URL must be provided"

  /plugins/{id}/activate:
    post:
      summary: Activate a plugin
      tags:
        - plugins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID
      responses:
        '200':
          description: Plugin activated
          content:
            text/plain:
              schema:
                type: string
                example: Plugin "plugin-1" activated.
        '404':
          description: Plugin not found
          content:
            text/plain:
              schema:
                type: string
                example: Plugin with id "plugin-1" not found.

  /plugins/{id}/deactivate:
    post:
      summary: Deactivate a plugin
      tags:
        - plugins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID
      responses:
        '200':
          description: Plugin deactivated
          content:
            text/plain:
              schema:
                type: string
                example: Plugin "plugin-1" deactivated.
        '404':
          description: Plugin not found
          content:
            text/plain:
              schema:
                type: string
                example: Plugin with id "plugin-1" not found.

  /plugins/{id}:
    delete:
      summary: Delete a plugin
      tags:
        - plugins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID
      responses:
        '200':
          description: Plugin deleted
          content:
            text/plain:
              schema:
                type: string
                example: Plugin "plugin-1" deleted.
        '404':
          description: Plugin not found
          content:
            text/plain:
              schema:
                type: string
                example: Plugin with id "plugin-1" not found.

  /auth/login:
    post:
      summary: Login and obtain authentication cookies
      tags:
        - auth
      requestBody:
        required: true
        description: Login credentials
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Password for authentication
              required:
                - password
              example:
                password: "your-password"
      responses:
        '200':
          description: Login successful, cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Sets oas-tlm-access-token and oas-tlm-refresh-token cookies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  message:
                    type: string
                example:
                  valid: true
                  message: Login successful
        '400':
          description: Invalid password
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  message:
                    type: string
                example:
                  valid: false
                  message: Invalid password

  /auth/logout:
    post:
      summary: Logout and clear authentication cookies
      tags:
        - auth
      responses:
        '200':
          description: Logout successful, cookies cleared
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Clears oas-tlm-access-token and oas-tlm-refresh-token cookies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  message:
                    type: string
                example:
                  valid: true
                  message: Logged out

  /auth/refresh:
    post:
      summary: Refresh access token using refresh token cookie
      tags:
        - auth
      responses:
        '200':
          description: Access token refreshed, new cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Sets a new oas-tlm-access-token cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  message:
                    type: string
                example:
                  valid: true
                  message: Refreshed
        '401':
          description: Invalid or missing refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  message:
                    type: string
                example:
                  valid: false
                  message: Invalid refresh token

  /auth/enabled:
    get:
      summary: Check if authentication is enabled
      tags:
        - auth
      responses:
        '200':
          description: Returns whether authentication is enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                example:
                  enabled: true

